<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users · MusicVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="container pb-5">
    <h1 class="h2 mb-1">Users</h1>
    <p class="text-muted mb-4">Browse MusicVault members and follow people you like.</p>

    <div class="row g-3">
        <div class="col-md-6" th:each="user : ${users}">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h2 class="h5">
                        <a th:href="@{/users/{id}(id=${user.userId()})}" th:text="${user.username()}">alice</a>
                    </h2>
                    <p class="text-muted small mb-2"
                       th:text="${user.bio() != null ? user.bio() : 'No bio yet.'}">Bio</p>
                    <p class="small mb-0">
                        <span th:text="${user.followerCount()}">0</span> followers ·
                        <span th:text="${user.followingCount()}">0</span> following
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
