<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${profile.username + ' · MusicVault'}">User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="container pb-5">
    <a class="btn btn-link ps-0 mb-3" th:href="@{/users}">&larr; Back to users</a>

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-start gap-3 mb-4">
        <div>
            <h1 class="h2 mb-1" th:text="${profile.username}">alice</h1>
            <p class="text-muted" th:text="${'Joined ' + profile.joinDate}">Joined</p>
            <p th:text="${profile.bio != null ? profile.bio : 'No bio yet.'}">Bio</p>
            <p class="mb-0">
                <strong th:text="${profile.followerCount}">0</strong> followers ·
                <strong th:text="${profile.followingCount}">0</strong> following
            </p>
        </div>
        <div sec:authorize="isAuthenticated()" th:if="${!profile.ownProfile}">
            <form th:if="${!profile.currentlyFollowing}" th:action="@{/users/{id}/follow(id=${profile.userId})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-primary" type="submit">Follow</button>
            </form>
            <form th:if="${profile.currentlyFollowing}" th:action="@{/users/{id}/unfollow(id=${profile.userId})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-outline-secondary" type="submit">Unfollow</button>
            </form>
        </div>
        <div sec:authorize="!isAuthenticated()" th:if="${!profile.ownProfile}">
            <a class="btn btn-primary" th:href="@{/login}">Login to follow</a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <h2 class="h5">Followers</h2>
            <ul class="list-unstyled" th:if="${!#lists.isEmpty(profile.followers)}">
                <li th:each="f : ${profile.followers}" class="mb-1">
                    <a th:href="@{/users/{id}(id=${f.userId})}" th:text="${f.username}">user</a>
                </li>
            </ul>
            <p class="text-muted" th:if="${#lists.isEmpty(profile.followers)}">No followers yet.</p>
        </div>
        <div class="col-md-4">
            <h2 class="h5">Following</h2>
            <ul class="list-unstyled" th:if="${!#lists.isEmpty(profile.followingUsers)}">
                <li th:each="f : ${profile.followingUsers}" class="mb-1">
                    <a th:href="@{/users/{id}(id=${f.userId})}" th:text="${f.username}">user</a>
                </li>
            </ul>
            <p class="text-muted" th:if="${#lists.isEmpty(profile.followingUsers)}">Not following anyone yet.</p>
        </div>
        <div class="col-md-4">
            <h2 class="h5">Lists</h2>
            <ul class="list-unstyled" th:if="${!#lists.isEmpty(lists)}">
                <li th:each="list : ${lists}" class="mb-1">
                    <a th:href="@{/lists/{id}(id=${list.listId()})}"
                       th:text="${list.name() + ' (' + list.albumCount() + ')'}">List</a>
                </li>
            </ul>
            <p class="text-muted" th:if="${#lists.isEmpty(lists)}">No public lists.</p>
        </div>
    </div>
</main>
</body>
</html>
