<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${album.title + ' · MusicVault'}">Album Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="container pb-5">
    <a class="btn btn-link ps-0 mb-3" th:href="@{/albums}">&larr; Back to albums</a>

    <div class="row g-4">
        <div class="col-lg-8">
            <h1 class="h2" th:text="${album.title}">Album Title</h1>
            <p class="text-muted">
                <span th:text="${album.releaseDate != null ? album.releaseDate : 'Unknown date'}">2024</span>
                · <span th:text="${album.releaseType}">Album</span>
                · <span th:text="${album.recordLabel != null ? album.recordLabel : 'Independent'}">Label</span>
            </p>

            <p th:if="${album.avgRating != null}">
                <span class="badge text-bg-warning text-dark fs-6"
                      th:text="${album.avgRating + ' ★ average (' + album.ratingCount + ' ratings)'}">4.5 ★</span>
            </p>

            <div class="card shadow-sm mb-4" sec:authorize="isAuthenticated()">
                <div class="card-body">
                    <h2 class="h5">Your Rating</h2>
                    <form class="row g-2 align-items-end" th:action="@{/albums/{id}/rating(id=${album.albumId})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="col-sm-4">
                            <label class="form-label" for="score">Score</label>
                            <select class="form-select" id="score" name="score" required>
                                <option th:each="value : ${#numbers.sequence(1,10)}"
                                        th:value="${value / 2.0}"
                                        th:selected="${album.currentUserRating != null and album.currentUserRating == value / 2.0}"
                                        th:text="${value / 2.0}">0.5</option>
                            </select>
                        </div>
                        <div class="col-sm-auto">
                            <button class="btn btn-primary" type="submit"
                                    th:text="${album.currentUserRating != null ? 'Update Rating' : 'Save Rating'}">Save Rating</button>
                        </div>
                    </form>
                    <form class="mt-2" th:if="${album.currentUserRating != null}"
                          th:action="@{/albums/{id}/rating/delete(id=${album.albumId})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-danger btn-sm" type="submit">Remove Rating</button>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm mb-4" sec:authorize="isAuthenticated()">
                <div class="card-body">
                    <h2 class="h5">Save Album</h2>
                    <div class="d-flex flex-wrap gap-2">
                        <th:block th:each="status : ${saveStatuses}">
                            <form th:if="${!#sets.contains(album.currentUserSaveStatuses, status)}"
                                  th:action="@{/saves/albums/{albumId}/add(albumId=${album.albumId})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="status" th:value="${status}">
                                <button class="btn btn-outline-primary btn-sm" type="submit"
                                        th:text="${'Add to ' + status}">Add</button>
                            </form>
                            <form th:if="${#sets.contains(album.currentUserSaveStatuses, status)}"
                                  th:action="@{/saves/albums/{albumId}/remove(albumId=${album.albumId})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="status" th:value="${status}">
                                <button class="btn btn-primary btn-sm" type="submit"
                                        th:text="${'Remove from ' + status}">Remove</button>
                            </form>
                        </th:block>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mb-4" sec:authorize="isAuthenticated()"
                 th:if="${!#lists.isEmpty(album.currentUserLists)}">
                <div class="card-body">
                    <h2 class="h5">Add to List</h2>
                    <form class="row g-2 align-items-end" th:action="@{/lists/add-album}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="albumId" th:value="${album.albumId}">
                        <input type="hidden" name="redirect" value="album">
                        <div class="col-sm-6">
                            <label class="form-label" for="listId">List</label>
                            <select class="form-select" id="listId" name="listId" required>
                                <option th:each="listOption : ${album.currentUserLists}"
                                        th:value="${listOption.listId}"
                                        th:text="${listOption.name}">List</option>
                            </select>
                        </div>
                        <div class="col-sm-auto">
                            <button class="btn btn-primary" type="submit">Add to List</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="mb-4" th:if="${!#lists.isEmpty(album.artists)}">
                <h2 class="h5">Artists</h2>
                <ul class="mb-0">
                    <li th:each="artist : ${album.artists}" th:text="${artist}">Artist</li>
                </ul>
            </div>

            <div class="mb-4" th:if="${!#lists.isEmpty(album.genres)}">
                <h2 class="h5">Genres</h2>
                <div>
                    <span class="badge text-bg-light border me-1 mb-1"
                          th:each="genre : ${album.genres}"
                          th:text="${genre}">Rock</span>
                </div>
            </div>

            <div class="mb-4" th:if="${!#lists.isEmpty(album.tracks)}">
                <h2 class="h5">Track Listing</h2>
                <table class="table table-sm align-middle">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Title</th>
                        <th>Duration</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="track : ${album.tracks}">
                        <td th:text="${track.trackNo}">1</td>
                        <td th:text="${track.title}">Track</td>
                        <td th:text="${track.duration != null ? track.duration : '--:--'}">00:00</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="card shadow-sm mb-4" sec:authorize="isAuthenticated()">
                <div class="card-body">
                    <h2 class="h5" th:text="${album.editableReview != null ? 'Edit Review' : 'Write a Review'}">Write a Review</h2>
                    <form th:action="@{/albums/{id}/reviews(id=${album.albumId})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="reviewId" th:if="${album.editableReview != null}" th:value="${album.editableReview.reviewId}">
                        <textarea class="form-control mb-3" name="content" rows="4" maxlength="2000" required
                                  th:text="${album.editableReview != null ? album.editableReview.content : ''}"></textarea>
                        <button class="btn btn-primary" type="submit"
                                th:text="${album.editableReview != null ? 'Update Review' : 'Post Review'}">Post Review</button>
                        <a class="btn btn-link" th:if="${album.editableReview != null}" th:href="@{/albums/{id}(id=${album.albumId})}">Cancel</a>
                    </form>
                </div>
            </div>

            <div class="mb-4">
                <h2 class="h5">Reviews</h2>
                <div th:if="${#lists.isEmpty(album.reviews)}" class="text-muted">No reviews yet.</div>
                <div th:each="review : ${album.reviews}" class="card shadow-sm mb-3">
                    <div class="card-body">
                        <div class="d-flex justify-content-between gap-3">
                            <div>
                                <strong th:text="${review.authorUsername}">alice</strong>
                                <span class="text-muted small" th:if="${review.postDate != null}" th:text="${' · ' + review.postDate}">date</span>
                            </div>
                            <div th:if="${review.ownReview}" class="d-flex gap-2">
                                <a class="btn btn-outline-secondary btn-sm"
                                   th:href="@{/albums/{id}(id=${album.albumId}, editReview=${review.reviewId})}">Edit</a>
                                <form th:action="@{/albums/{id}/reviews/{reviewId}/delete(id=${album.albumId}, reviewId=${review.reviewId})}"
                                      method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button class="btn btn-outline-danger btn-sm" type="submit">Delete</button>
                                </form>
                            </div>
                        </div>
                        <p class="mb-0 mt-3" th:text="${review.content}">Review text</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm" th:if="${!#lists.isEmpty(album.streamingLinks)}">
                <div class="card-body">
                    <h2 class="h5 card-title">Streaming</h2>
                    <ul class="list-unstyled mb-0">
                        <li class="mb-2" th:each="link : ${album.streamingLinks}">
                            <a th:href="${link.externalUrl}" th:text="${link.serviceName}" target="_blank" rel="noopener">Spotify</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
