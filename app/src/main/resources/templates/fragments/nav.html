<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/albums}">MusicVault</a>
        <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2 flex-row flex-wrap">
            <a class="nav-link" th:href="@{/albums}">Browse Albums</a>
            <a class="nav-link" th:href="@{/users}">Users</a>
            <a class="nav-link" sec:authorize="isAuthenticated()" th:href="@{/lists}">My Lists</a>
            <a class="nav-link" sec:authorize="isAuthenticated()" th:href="@{/saves}">My Saves</a>
            <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Admin</a>
            <span sec:authorize="!isAuthenticated()">
                <a class="nav-link" th:href="@{/login}">Login</a>
                <a class="nav-link" th:href="@{/register}">Register</a>
            </span>
            <span sec:authorize="isAuthenticated()" class="d-flex align-items-center">
                <span class="navbar-text text-light small me-2">
                    Signed in as <strong sec:authentication="name">user</strong>
                </span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                </form>
            </span>
        </div>
    </div>
</nav>
</body>
</html>
