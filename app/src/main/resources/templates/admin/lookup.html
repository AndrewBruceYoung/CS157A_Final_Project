<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title + ' · Admin · MusicVault'}">Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="container pb-5">
    <a class="btn btn-link ps-0 mb-3" th:href="@{/admin}">&larr; Admin dashboard</a>
    <h1 class="h2 mb-3" th:text="${title}">Lookup</h1>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5">Add New</h2>
            <form class="row g-2 align-items-end" th:action="@{'/admin/' + ${section}}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="col-md-8">
                    <label class="form-label" for="name">Name</label>
                    <input class="form-control" id="name" name="name" required maxlength="200">
                </div>
                <div class="col-md-auto">
                    <button class="btn btn-primary" type="submit">Add</button>
                </div>
            </form>
        </div>
    </div>

    <div class="list-group shadow-sm">
        <div class="list-group-item" th:each="item : ${items}">
            <form class="row g-2 align-items-center" th:action="@{'/admin/' + ${section} + '/' + ${item.id}}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="col-md-8">
                    <input class="form-control" name="name" th:value="${item.name}" required maxlength="200">
                </div>
                <div class="col-md-auto d-flex gap-2">
                    <button class="btn btn-outline-secondary btn-sm" type="submit">Save</button>
                </div>
            </form>
            <form class="mt-2" th:action="@{'/admin/' + ${section} + '/' + ${item.id} + '/delete'}" method="post"
                  onsubmit="return confirm('Delete this item?');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-outline-danger btn-sm" type="submit">Delete</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
