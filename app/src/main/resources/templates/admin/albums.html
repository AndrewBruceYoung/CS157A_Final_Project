<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Albums · Admin · MusicVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="container pb-5">
    <a class="btn btn-link ps-0 mb-3" th:href="@{/admin}">&larr; Admin dashboard</a>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h2 mb-0">Albums</h1>
        <a class="btn btn-primary" th:href="@{/admin/albums/new}">Add Album</a>
    </div>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>

    <div class="list-group shadow-sm">
        <a class="list-group-item list-group-item-action"
           th:each="album : ${albums}"
           th:href="@{/admin/albums/{id}(id=${album.albumId})}">
            <div class="d-flex justify-content-between">
                <strong th:text="${album.title}">Title</strong>
                <span class="text-muted small" th:text="${album.typeName}">Album</span>
            </div>
            <div class="small text-muted"
                 th:text="${(album.releaseDate != null ? album.releaseDate : 'No date')
                            + ' · '
                            + (album.labelName != null ? album.labelName : 'No label')}">
                Date · Label
            </div>
        </a>
    </div>
</main>
</body>
</html>
