<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Album · Admin · MusicVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="container pb-5" style="max-width: 720px;">
    <a class="btn btn-link ps-0 mb-3" th:href="@{/admin/albums}">&larr; Albums</a>
    <h1 class="h2 mb-4">Add Album</h1>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>

    <form th:action="@{/admin/albums}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label class="form-label" for="title">Title</label>
            <input class="form-control" id="title" name="title" required maxlength="300">
        </div>
        <div class="mb-3">
            <label class="form-label" for="releaseDate">Release Date</label>
            <input class="form-control" id="releaseDate" name="releaseDate" type="date">
        </div>
        <div class="mb-3">
            <label class="form-label" for="typeId">Release Type</label>
            <select class="form-select" id="typeId" name="typeId" required>
                <option th:each="type : ${types}" th:value="${type.id}" th:text="${type.name}">Album</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label" for="labelId">Record Label</label>
            <select class="form-select" id="labelId" name="labelId">
                <option value="">None</option>
                <option th:each="label : ${labels}" th:value="${label.id}" th:text="${label.name}">Label</option>
            </select>
        </div>
        <button class="btn btn-primary" type="submit">Create Album</button>
    </form>
</main>
</body>
</html>
