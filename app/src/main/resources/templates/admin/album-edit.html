<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${album.title + ' · Admin · MusicVault'}">Edit Album</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="container pb-5">
    <a class="btn btn-link ps-0 mb-3" th:href="@{/admin/albums}">&larr; Albums</a>
    <h1 class="h2 mb-3" th:text="${'Edit: ' + album.title}">Edit Album</h1>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5">Album Details</h2>
            <form th:action="@{/admin/albums/{id}(id=${album.albumId})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label class="form-label" for="title">Title</label>
                    <input class="form-control" id="title" name="title" required maxlength="300" th:value="${album.title}">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="releaseDate">Release Date</label>
                    <input class="form-control" id="releaseDate" name="releaseDate" type="date"
                           th:value="${album.releaseDate}">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="typeId">Release Type</label>
                    <select class="form-select" id="typeId" name="typeId" required>
                        <option th:each="type : ${types}"
                                th:value="${type.id}"
                                th:selected="${type.id == album.typeId}"
                                th:text="${type.name}">Album</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="labelId">Record Label</label>
                    <select class="form-select" id="labelId" name="labelId">
                        <option value="">None</option>
                        <option th:each="label : ${labels}"
                                th:value="${label.id}"
                                th:selected="${album.labelId != null and label.id == album.labelId}"
                                th:text="${label.name}">Label</option>
                    </select>
                </div>
                <button class="btn btn-primary" type="submit">Save Album</button>
            </form>
            <form class="mt-3" th:action="@{/admin/albums/{id}/delete(id=${album.albumId})}" method="post"
                  onsubmit="return confirm('Delete this album and related tracks/reviews?');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-outline-danger" type="submit">Delete Album</button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5">Tracks</h2>
            <ul class="list-group mb-3" th:if="${!#lists.isEmpty(tracks)}">
                <li class="list-group-item d-flex justify-content-between align-items-center"
                    th:each="track : ${tracks}">
                    <span>
                        <strong th:text="${track.trackNo + '.'}">1.</strong>
                        <span th:text="${track.title}">Title</span>
                        <span class="text-muted small"
                              th:if="${track.duration != null}"
                              th:text="${' (' + track.duration + ')'}"> (3:00)</span>
                    </span>
                    <form th:action="@{/admin/albums/{id}/tracks/{trackNo}/delete(id=${album.albumId}, trackNo=${track.trackNo})}"
                          method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-danger btn-sm" type="submit">Remove</button>
                    </form>
                </li>
            </ul>
            <p class="text-muted" th:if="${#lists.isEmpty(tracks)}">No tracks yet.</p>
            <form class="row g-2 align-items-end" th:action="@{/admin/albums/{id}/tracks(id=${album.albumId})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="col-md-2">
                    <label class="form-label" for="trackNo">#</label>
                    <input class="form-control" id="trackNo" name="trackNo" type="number" min="1" required>
                </div>
                <div class="col-md-5">
                    <label class="form-label" for="trackTitle">Title</label>
                    <input class="form-control" id="trackTitle" name="title" required maxlength="300">
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="duration">Duration (HH:MM:SS)</label>
                    <input class="form-control" id="duration" name="duration" placeholder="00:03:30">
                </div>
                <div class="col-md-auto">
                    <button class="btn btn-primary" type="submit">Add Track</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5">Genres</h2>
            <div class="mb-3">
                <span class="badge text-bg-light border me-1 mb-1" th:each="g : ${albumGenres}">
                    <span th:text="${g.name}">Rock</span>
                    <form class="d-inline"
                          th:action="@{/admin/albums/{id}/genres/{genreId}/delete(id=${album.albumId}, genreId=${g.id})}"
                          method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-link btn-sm p-0 ms-1" type="submit">×</button>
                    </form>
                </span>
            </div>
            <form class="row g-2 align-items-end" th:action="@{/admin/albums/{id}/genres(id=${album.albumId})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="col-md-6">
                    <label class="form-label" for="genreId">Add Genre</label>
                    <select class="form-select" id="genreId" name="genreId" required>
                        <option th:each="g : ${allGenres}" th:value="${g.id}" th:text="${g.name}">Genre</option>
                    </select>
                </div>
                <div class="col-md-auto">
                    <button class="btn btn-primary" type="submit">Add</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
