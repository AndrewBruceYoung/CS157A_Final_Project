<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${list.name + ' · MusicVault'}">List Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="container pb-5">
    <a class="btn btn-link ps-0 mb-3" th:href="@{/lists}">&larr; Back to my lists</a>

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-start gap-3 mb-4">
        <div>
            <h1 class="h2 mb-1" th:text="${list.name}">List</h1>
            <p class="text-muted mb-1">
                By
                <a th:href="@{/users/{id}(id=${list.ownerUserId})}" th:text="${list.ownerUsername}">user</a>
            </p>
            <p th:if="${list.description != null}" th:text="${list.description}">Description</p>
        </div>
        <div class="d-flex gap-2" th:if="${list.ownedByCurrentUser}">
            <a class="btn btn-outline-secondary" th:href="@{/lists/{id}/edit(id=${list.listId})}">Edit</a>
            <form th:action="@{/lists/{id}/delete(id=${list.listId})}" method="post"
                  onsubmit="return confirm('Delete this list?');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-outline-danger" type="submit">Delete</button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm mb-4" th:if="${list.ownedByCurrentUser}">
        <div class="card-body">
            <h2 class="h5">Add Album</h2>
            <form class="row g-2 align-items-end" th:action="@{/lists/{id}/albums(id=${list.listId})}" method="post"
                  th:if="${availableAlbums != null and !#lists.isEmpty(availableAlbums)}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="col-md-8">
                    <label class="form-label" for="albumId">Album</label>
                    <select class="form-select" id="albumId" name="albumId" required>
                        <option th:each="album : ${availableAlbums}"
                                th:value="${album.albumId}"
                                th:text="${album.title}">Album</option>
                    </select>
                </div>
                <div class="col-md-auto">
                    <button class="btn btn-primary" type="submit">Add</button>
                </div>
            </form>
            <p class="text-muted mb-0" th:if="${availableAlbums == null or #lists.isEmpty(availableAlbums)}">
                No more albums available to add.
            </p>
        </div>
    </div>

    <h2 class="h5 mb-3">Albums</h2>
    <div th:if="${#lists.isEmpty(list.albums)}" class="text-muted">This list is empty.</div>

    <div class="list-group shadow-sm" th:if="${!#lists.isEmpty(list.albums)}">
        <div class="list-group-item" th:each="item : ${list.albums}">
            <div class="d-flex justify-content-between gap-3 align-items-start">
                <div>
                    <span class="text-muted me-2" th:text="${item.position() + '.'}">1.</span>
                    <a th:href="@{/albums/{id}(id=${item.album().albumId})}"
                       th:text="${item.album().title}">Album</a>
                    <div class="small text-muted"
                         th:text="${item.album().artists != null ? item.album().artists : 'Unknown artist'}">Artist</div>
                </div>
                <form th:if="${list.ownedByCurrentUser}"
                      th:action="@{/lists/{id}/albums/{albumId}/remove(id=${list.listId}, albumId=${item.album().albumId})}"
                      method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-outline-danger btn-sm" type="submit">Remove</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
