<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Lists · MusicVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="container pb-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <h1 class="h2 mb-1">My Lists</h1>
            <p class="text-muted mb-0">Create personalized album lists.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/lists/new}">Create List</a>
    </div>

    <div th:if="${#lists.isEmpty(lists)}" class="text-muted">You have no lists yet.</div>

    <div class="list-group shadow-sm" th:if="${!#lists.isEmpty(lists)}">
        <a class="list-group-item list-group-item-action"
           th:each="list : ${lists}"
           th:href="@{/lists/{id}(id=${list.listId()})}">
            <div class="d-flex justify-content-between">
                <strong th:text="${list.name()}">List name</strong>
                <span class="text-muted" th:text="${list.albumCount() + ' albums'}">0 albums</span>
            </div>
            <div class="small text-muted" th:if="${list.description() != null}" th:text="${list.description()}">Desc</div>
        </a>
    </div>
</main>
</body>
</html>
