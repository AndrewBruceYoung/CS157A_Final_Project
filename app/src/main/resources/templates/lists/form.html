<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${editMode == true} ? 'Edit List · MusicVault' : 'Create List · MusicVault'">List Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="container pb-5" style="max-width: 640px;">
    <h1 class="h2 mb-4" th:text="${editMode == true} ? 'Edit List' : 'Create List'">Create List</h1>

    <form th:action="${editMode == true} ? @{/lists/{id}(id=${list.listId})} : @{/lists}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label class="form-label" for="name">Name</label>
            <input class="form-control" id="name" name="name" maxlength="200" required
                   th:value="${editMode == true} ? ${list.name} : ''">
        </div>
        <div class="mb-3">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" maxlength="1000"
                      th:text="${editMode == true} ? ${list.description} : ''"></textarea>
        </div>
        <button class="btn btn-primary" type="submit" th:text="${editMode == true} ? 'Save Changes' : 'Create List'">Create</button>
        <a class="btn btn-link" th:href="${editMode == true} ? @{/lists/{id}(id=${list.listId})} : @{/lists}">Cancel</a>
    </form>
</main>
</body>
</html>
