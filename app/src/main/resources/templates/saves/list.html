<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Saves · MusicVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="container pb-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <h1 class="h2 mb-1">My Saves</h1>
            <p class="text-muted mb-0">Albums in your collection, favorites, and wishlist.</p>
        </div>
        <div class="btn-group">
            <a class="btn" th:classappend="${selectedStatus == ''} ? 'btn-dark' : 'btn-outline-dark'"
               th:href="@{/saves}">All</a>
            <a class="btn" th:each="status : ${statuses}"
               th:classappend="${selectedStatus == status} ? 'btn-dark' : 'btn-outline-dark'"
               th:href="@{/saves(status=${status})}"
               th:text="${status}">Owned</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(saves)}" class="text-muted">No saved albums yet.</div>

    <div class="row g-3">
        <div class="col-md-6" th:each="item : ${saves}">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between gap-2 mb-2">
                        <span class="badge text-bg-secondary" th:text="${item.status}">Favorite</span>
                        <form th:action="@{/saves/albums/{albumId}/remove(albumId=${item.album.albumId})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="status" th:value="${item.status}">
                            <input type="hidden" name="redirect" value="saves">
                            <button class="btn btn-outline-danger btn-sm" type="submit">Remove</button>
                        </form>
                    </div>
                    <h2 class="h5 card-title mb-1">
                        <a th:href="@{/albums/{id}(id=${item.album.albumId})}"
                           th:text="${item.album.title}">Album</a>
                    </h2>
                    <p class="text-muted small mb-0"
                       th:text="${item.album.artists != null ? item.album.artists : 'Unknown artist'}">Artist</p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
